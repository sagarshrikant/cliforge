# =============================================================================
# coverage.yml — lcov Coverage Report + Regression Gate
# =============================================================================
# Runs on every push to main and on every pull request targeting main.
#
# Jobs:
#   coverage — build with gcov instrumentation, run all tests, generate lcov
#              HTML report, enforce coverage floor (no regressions allowed).
#
# Coverage policy (see CONTRIBUTING.md § Test policy):
#   - Overall line coverage must not drop below COVERAGE_FLOOR.
#   - COVERAGE_FLOOR is a ratchet: raise it as coverage improves, never lower.
#   - 100% is not the goal; well-tested error paths and new features matter more.
# =============================================================================

name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Raise this floor as overall coverage improves. Never lower it.
  COVERAGE_FLOOR: "52"

jobs:
  coverage:
    name: Test Coverage (lcov)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ lcov

      - name: Configure (Debug + coverage instrumentation)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCLIFORGE_BUILD_TESTS=ON \
            -DCLIFORGE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      - name: Run system tests
        run: ctest --test-dir build -L system --output-on-failure

      - name: Capture coverage
        # Note: --ignore-errors mismatch is NOT used here because ubuntu-22.04
        # ships lcov 1.14 which does not support that flag.  The mismatch
        # warning only appears in lcov 2.x (used locally); on 1.14 it is not
        # emitted so no suppression is needed.
        run: |
          lcov --capture \
               --directory build \
               --output-file coverage.info \
               --quiet

      - name: Filter out noise
        # --ignore-errors unused is NOT used: ubuntu-22.04 ships lcov 1.14
        # which does not support that flag and does not generate unused-pattern
        # errors.  Both flags are lcov 2.x additions.
        run: |
          lcov --remove coverage.info \
               '*/usr/*' \
               '*/googletest/*' \
               '*/googlemock/*' \
               '*/tests/*' \
               '*/build*/*' \
               '*/cliforge_version.h' \
               --output-file coverage_filtered.info \
               --quiet

      - name: Generate HTML report
        run: |
          genhtml coverage_filtered.info \
                  --output-directory coverage_html \
                  --title "cliforge coverage" \
                  --quiet

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage-html-report
          path: coverage_html/
          retention-days: 14

      - name: Print coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lcov --summary coverage_filtered.info 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Enforce coverage floor
        # Extracts the line-coverage percentage and fails if it drops below
        # COVERAGE_FLOOR.  This is a ratchet — raise the floor in env: above
        # as coverage improves; never lower it.
        run: |
          LINES=$(lcov --summary coverage_filtered.info 2>&1 \
                  | grep -oP '\d+\.\d+(?=% \()' | head -1)
          echo "Line coverage: ${LINES}%  (floor: ${COVERAGE_FLOOR}%)"
          echo "line_coverage=${LINES}" >> $GITHUB_STEP_SUMMARY
          python3 - <<EOF
          import sys
          cov   = float("${LINES}")
          floor = float("${COVERAGE_FLOOR}")
          if cov < floor:
              print(f"FAIL: coverage {cov:.1f}% is below floor {floor:.0f}%")
              print("Either add tests or raise the floor after deliberate review.")
              sys.exit(1)
          print(f"OK: coverage {cov:.1f}% >= floor {floor:.0f}%")
          EOF

      # ── Optional: upload to Coveralls ─────────────────────────────────────
      # Sign up at https://coveralls.io and add COVERALLS_REPO_TOKEN to
      # Settings → Secrets → Actions, then uncomment:
      #
      # - name: Upload to Coveralls
      #   uses: coverallsapp/github-action@v2
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     path-to-lcov: coverage_filtered.info

      # ── Optional: upload to Codecov ───────────────────────────────────────
      # Sign up at https://codecov.io, then uncomment:
      #
      # - name: Upload to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage_filtered.info
      #     fail_ci_if_error: true
