# =============================================================================
# ci.yml — Build + Unit Test
# =============================================================================
# Runs on every push and pull request.
# Think of this as the mandatory quality gate: nothing merges without a green build.
#
# Matrix: tests against GCC on Ubuntu 22.04 (primary target).
# Add more matrix entries later for clang or QNX cross-compile if needed.
# =============================================================================

name: CI

on:
  push:
    branches: [ "main", "dev", "release/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler }}, C${{ matrix.c_std }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # C11 with GCC — primary
          - compiler: gcc
            c_std: "11"
          # C99 with GCC — compatibility check
          - compiler: gcc
            c_std: "99"
          # C11 with Clang — catch GCC-ism bugs early
          - compiler: clang
            c_std: "11"

    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.compiler == 'gcc' && 'gcc g++' || 'clang clang++' }}

      - name: Configure (C${{ matrix.c_std }})
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_STANDARD=${{ matrix.c_std }} \
            -DCLIFORGE_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }}

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -V

      - name: Run system tests
        run: ctest --test-dir build -L system --output-on-failure -V
        continue-on-error: true   # system tests may need fixtures; don't block unit-test result
